name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # This repo is PUBLIC: hosted runners are fine here. Every private repo
    # in the estate runs on the self-hosted pr-shared pool instead (zero
    # Actions spend); this repo is the one exception by design.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      - name: Run tests
        run: bash tests/run.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # Includes worker/test/parity.test.ts, which runs scripts/check-body.sh
      # and its TypeScript port over the same fixtures and fails if the two
      # verdicts differ.
      - run: npm test

      - run: npx tsc --noEmit
